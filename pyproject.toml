[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-link"
version = "0.1.0"
description = "Manuscript local-first Windows voice dictation and writing assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faster-whisper==1.2.1",
  "numpy==2.4.6",
  "onnxruntime==1.27.0",
  "pyperclip==1.11.0",
  "PySide6==6.11.1",
  "sounddevice==0.5.5",
  "sqlcipher3==0.6.2; platform_system == 'Windows'",
  "symspellpy==6.10.0",
  "tokenizers==0.23.1",
  "uiautomation==2.0.29; platform_system == 'Windows'",
  "winrt-runtime==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Media.Control==3.2.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = ["Pillow==12.3.0", "pyinstaller==6.20.0"]
test = ["pytest==9.1.1"]
lint = ["ruff==0.14.6"]

[project.scripts]
manuscript = "echo_link_app.main:main"
echo-link = "echo_link_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Deliberately narrow. These are the checks that catch the defects this
# repository has actually shipped: dead imports and variables (a scripted
# deletion once left two constants unreferenced), and blind excepts (a
# swallowed error hid a real insertion failure). Style-only rules are left off
# so that a lint run means something.
select = ["F", "BLE", "T20"]
# BLE001 currently reports 152 existing blind excepts, concentrated in engine.py,
# windows_selection.py and insertion.py. Auditing them is its own work item; each
# site has to be narrowed, handled, logged with context, or kept broad with a
# written reason. Ignored so that a non-zero exit means a NEW defect rather than
# a known backlog. Remove this line when that audit lands; it is the last step
# of it. Tracked in docs/ARCHITECTURE.md.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Probes and harnesses report to a human on stdout; that is their interface.
"tools/*" = ["T201", "T203"]
"tests/*" = ["T201", "T203"]

